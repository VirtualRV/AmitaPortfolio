<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Obsidian to Charcoal) -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1a1e1d" />
      <stop offset="55%" stop-color="#0d1110" />
      <stop offset="100%" stop-color="#050706" />
    </radialGradient>

    <!-- Squircle Border Gradient (International Orange Glow) -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d1c" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#ff7a4d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff4d1c" stop-opacity="0.6" />
    </linearGradient>

    <!-- Bone-White / Platinum Titanium Gradient for Letter A -->
    <linearGradient id="boneGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f2efe9" />
      <stop offset="70%" stop-color="#d1cbc0" />
      <stop offset="100%" stop-color="#8a8376" />
    </linearGradient>

    <!-- Bone-White Titanium Gradient for Letter D -->
    <linearGradient id="boneGradD" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f2efe9" />
      <stop offset="75%" stop-color="#c4beb2" />
      <stop offset="100%" stop-color="#736d62" />
    </linearGradient>

    <!-- International Orange Glowing Edge Filter -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ff4d1c" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#ff4d1c" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="18" y="18" width="476" height="476" rx="116" fill="url(#bgGlow)" stroke="url(#squircleBorder)" stroke-width="6" />

  <!-- Subtle Studio Technical Grid Lines -->
  <g opacity="0.06" stroke="#ff4d1c" stroke-width="1.5">
    <line x1="64" y1="18" x2="64" y2="494" />
    <line x1="448" y1="18" x2="448" y2="494" />
    <line x1="18" y1="64" x2="494" y2="64" />
    <line x1="18" y1="448" x2="494" y2="448" />
    <circle cx="256" cy="256" r="175" fill="none" stroke-dasharray="4 8" />
  </g>

  <!-- Monogram Group with Orange Glow & Ambient Shadow -->
  <g filter="url(#orangeGlow)">
    <!-- Vibrant International Orange Halo / Outline Stroke -->
    <path d="M 216 128 L 104 364 L 160 364 L 186 306 L 274 306 L 292 344 C 324 362 366 368 406 344 C 448 318 464 270 464 236 C 464 172 420 132 348 132 C 304 132 268 148 246 178 Z"
          fill="none" stroke="#ff4d1c" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" opacity="0.9" />

    <!-- Letter 'A' (Faceted Bone-White Monogram) -->
    <!-- Left Leg -->
    <polygon points="216,128 232,164 160,360 110,360" fill="url(#boneGradA)" />
    <!-- Right Leg & Facet -->
    <polygon points="216,128 232,164 288,302 308,302" fill="url(#boneGradA)" opacity="0.92" />
    <!-- A Inner Cutout -->
    <polygon points="216,180 258,272 174,272" fill="#0d1110" stroke="#ff4d1c" stroke-width="3" stroke-opacity="0.8" />
    <!-- A Horizontal Crossbar Highlight -->
    <polygon points="170,268 266,268 276,292 160,292" fill="url(#boneGradA)" />

    <!-- Letter 'D' (Architectural Curve & Spine) -->
    <path d="M 252 140 C 288 140 328 146 360 172 C 398 200 416 240 416 272 C 416 314 390 348 350 352 C 314 356 280 346 256 330 L 256 292 C 274 304 298 312 322 310 C 352 308 368 284 368 260 C 368 224 342 194 298 192 C 278 192 262 196 252 202 Z"
          fill="url(#boneGradD)" />

    <!-- Sharp Titanium Bevel Highlights -->
    <line x1="216" y1="128" x2="232" y2="164" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="216" y1="128" x2="110" y2="360" stroke="#ffffff" stroke-width="3" opacity="0.8" />
    <path d="M 252 140 C 328 144 414 184 414 272" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.75" />

    <!-- Hallmark 4-Point Studio Starburst (International Orange) -->
    <g transform="translate(216, 128)">
      <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="#ff4d1c" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>
  </g>
</svg>
